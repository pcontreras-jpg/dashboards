<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  .ar-root { font-family: 'Poppins', sans-serif; color: #F2F2F2; background: #232323; padding: 32px 24px 48px; border-radius: 16px; }
  .ar-logo-img { display: block; margin: 0 auto 28px; max-width: 280px; width: 100%; height: auto; }
  .ar-section-title { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; font-size: 18px; font-weight: 600; margin: 36px 0 14px; color: #DAA812; }
  .ar-card { background: #2C2C2C; border: 0.5px solid #3D3D3D; border-radius: 12px; padding: 18px 20px; }
  .ar-form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .ar-form-row input, .ar-form-row select { font-family: 'Poppins', sans-serif; font-size: 14px; padding: 8px 10px; border: 0.5px solid #4A4A4A; border-radius: 8px; background: #232323; color: #F2F2F2; }
  .ar-form-row input[type="text"] { flex: 1; min-width: 140px; }
  .ar-form-row input[type="date"] { min-width: 140px; }
  .ar-add-btn { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; padding: 8px 16px; border-radius: 8px; border: none; background: #DAA812; color: #1A1A1A; cursor: pointer; }
  .ar-add-btn:hover { background: #C29710; }
  .ar-task-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid #3A3A3A; }
  .ar-task-item:last-child { border-bottom: none; }
  .ar-task-check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #DAA812; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; }
  .ar-task-check.done { background: #DAA812; border-color: #DAA812; color: #1A1A1A; font-size: 12px; }
  .ar-task-text { flex: 1; font-size: 14px; }
  .ar-task-text.done { text-decoration: line-through; color: #7A7A7A; }
  .ar-task-date { font-size: 12px; color: #9A9A9A; white-space: nowrap; }
  .ar-task-del { border: none; background: none; color: #7A7A7A; cursor: pointer; font-size: 15px; padding: 2px 4px; }
  .ar-task-del:hover { color: #DAA812; }
  .ar-empty { color: #7A7A7A; font-size: 13px; padding: 6px 0; }
  .ar-cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .ar-cal-nav { display: flex; gap: 6px; }
  .ar-cal-nav button { width: 30px; height: 30px; border-radius: 8px; border: 0.5px solid #4A4A4A; background: #232323; cursor: pointer; font-size: 14px; color: #F2F2F2; }
  .ar-cal-month { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 600; text-transform: capitalize; color: #DAA812; }
  .ar-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .ar-cal-dow { font-size: 11px; color: #9A9A9A; text-align: center; padding-bottom: 6px; text-transform: uppercase; }
  .ar-cal-cell { min-height: 78px; border: 0.5px solid #3A3A3A; border-radius: 8px; padding: 5px; background: #282828; }
  .ar-cal-cell.empty { background: transparent; border: none; }
  .ar-cal-daynum { font-size: 12px; color: #9A9A9A; margin-bottom: 3px; }
  .ar-chip { font-size: 10.5px; padding: 2px 6px; border-radius: 6px; margin-bottom: 3px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .ar-chip-rrss { background: #3A2E10; color: #F0C64A; }
  .ar-chip-wsp { background: #123420; color: #5FCB8C; }
  .ar-chip-web { background: #10233A; color: #6BAAF0; }
  .ar-chip-otro { background: #3A3A3A; color: #CFCFCF; }
  .ar-legend { display: flex; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .ar-legend span { font-size: 11px; color: #9A9A9A; display: flex; align-items: center; gap: 5px; }
  .ar-legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .ar-backup-bar { display: flex; gap: 8px; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 0.5px solid #3D3D3D; flex-wrap: wrap; }
  .ar-backup-btn { font-family: 'Poppins', sans-serif; font-size: 12.5px; padding: 7px 12px; border-radius: 8px; border: 0.5px solid #4A4A4A; background: #2C2C2C; color: #F2F2F2; cursor: pointer; }
  .ar-backup-btn:hover { background: #383838; }
  #save-status-ar { display: none; font-size: 12px; color: #E8A5A5; width: 100%; }
</style>

<script>
/* ===========================================================================
   Guardado compartido — no cambia nada del dashboard, solo dónde se guarda.
   Reemplaza el window.storage del Claude de escritorio por una tabla comun,
   asi todos los que abren el link ven y editan lo mismo, en vivo.
   =========================================================================== */
(function() {
  var SB_URL  = 'https://ljdjiyghodcfgenzjowt.supabase.co';
  var SB_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqZGppeWdob2RjZmdlbnpqb3d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NDI4NDMsImV4cCI6MjA5MDExODg0M30.TYvXvS-NXsbn56Wg4oN4g9C7Iv_KlS6nhN1f5tEnfx0';
  var TABLE   = 'shared_docs';
  var DOC_ID  = 'arueda';

  var API = SB_URL + '/rest/v1/' + TABLE;
  var HEAD = { 'apikey': SB_KEY, 'authorization': 'Bearer ' + SB_KEY, 'content-type': 'application/json' };

  var lastSeen = null;   // updated_at que ya tenemos pintado
  var writing  = false;  // hay una escritura nuestra en vuelo

  window.storage = {
    get: async function() {
      var r = await fetch(API + '?id=eq.' + DOC_ID + '&select=data,updated_at', { headers: HEAD });
      if (!r.ok) throw new Error('GET ' + r.status);
      var rows = await r.json();
      if (!rows.length) return null;
      lastSeen = rows[0].updated_at;
      return { value: rows[0].data };
    },
    set: async function(key, value) {
      writing = true;
      try {
        var body = [{ id: DOC_ID, data: value, updated_at: new Date().toISOString() }];
        var r = await fetch(API, {
          method: 'POST',
          headers: Object.assign({}, HEAD, { 'Prefer': 'resolution=merge-duplicates,return=representation' }),
          body: JSON.stringify(body)
        });
        if (!r.ok) throw new Error('POST ' + r.status);
        var rows = await r.json();
        if (rows && rows[0]) lastSeen = rows[0].updated_at;
      } finally { writing = false; }
    }
  };

  // Sincronizacion en vivo: si otra persona guardo, recargamos y repintamos.
  window.__sharedLive = function(reload) {
    setInterval(async function() {
      if (writing || document.hidden) return;
      try {
        var r = await fetch(API + '?id=eq.' + DOC_ID + '&select=updated_at', { headers: HEAD });
        if (!r.ok) return;
        var rows = await r.json();
        if (rows.length && rows[0].updated_at !== lastSeen) reload();
      } catch (e) { /* sin conexion: reintenta al proximo tick */ }
    }, 4000);
  };
})();

(function() {
  var STORAGE_KEY = 'ar-dashboard-data';
  var state = { tasks: [], calTasks: [] };
  var viewDate = new Date();

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  async function loadState() {
    try {
      var res = await window.storage.get(STORAGE_KEY, true);
      if (res && res.value) {
        var parsed = JSON.parse(res.value);
        state = Object.assign(state, parsed);
      }
    } catch (e) { /* no data yet */ }
    render();
  }

  async function saveState() {
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
        return;
      } catch (e) {
        if (attempt === 2) {
          console.error('storage error tras 3 intentos', e);
          var badge = document.getElementById('save-status-ar');
          if (badge) { badge.textContent = 'No se pudo guardar en la nube — usa "Descargar respaldo"'; badge.style.display = 'block'; }
        } else {
          await new Promise(function(r) { setTimeout(r, 500 * (attempt + 1)); });
        }
      }
    }
  }

  window.exportData = function() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'a-rueda-datos.json';
    a.click();
    URL.revokeObjectURL(url);
  };

  window.importData = function(evt) {
    var file = evt.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var parsed = JSON.parse(e.target.result);
        state = Object.assign({ tasks: [], calTasks: [] }, parsed);
        render();
        saveState();
      } catch (err) { alert('Archivo invalido'); }
    };
    reader.readAsText(file);
    evt.target.value = '';
  };

  window.addTask = function() {
    var input = document.getElementById('task-input');
    var dateInput = document.getElementById('task-date');
    var text = input.value.trim();
    if (!text) return;
    state.tasks.push({ id: uid(), text: text, date: dateInput.value, done: false });
    input.value = '';
    dateInput.value = '';
    render();
    saveState();
  };

  window.toggleTask = function(id) {
    var t = state.tasks.find(function(x) { return x.id === id; });
    if (t) t.done = !t.done;
    render();
    saveState();
  };

  window.deleteTask = function(id) {
    state.tasks = state.tasks.filter(function(x) { return x.id !== id; });
    render();
    saveState();
  };

  window.addCalTask = function() {
    var tareaInput = document.getElementById('cal-tarea');
    var diaInput = document.getElementById('cal-dia');
    var canalInput = document.getElementById('cal-canal');
    var tarea = tareaInput.value.trim();
    var dia = diaInput.value;
    if (!tarea || !dia) return;
    state.calTasks.push({ id: uid(), tarea: tarea, dia: dia, canal: canalInput.value });
    tareaInput.value = '';
    diaInput.value = '';
    viewDate = new Date(dia + 'T00:00:00');
    render();
    saveState();
  };

  window.deleteCalTask = function(id) {
    state.calTasks = state.calTasks.filter(function(x) { return x.id !== id; });
    render();
    saveState();
  };

  window.shiftMonth = function(delta) {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + delta, 1);
    render();
  };

  function renderTasks() {
    var list = document.getElementById('task-list');
    if (state.tasks.length === 0) {
      list.innerHTML = '<p class="ar-empty">Sin temas todavia.</p>';
      return;
    }
    var sorted = state.tasks.slice().sort(function(a, b) {
      return (a.date || '9999').localeCompare(b.date || '9999');
    });
    list.innerHTML = sorted.map(function(t) {
      var dateLabel = t.date ? formatDateShort(t.date) : '';
      return '<div class="ar-task-item">' +
        '<button class="ar-task-check' + (t.done ? ' done' : '') + '" onclick="toggleTask(\'' + t.id + '\')">' + (t.done ? '&#10003;' : '') + '</button>' +
        '<span class="ar-task-text' + (t.done ? ' done' : '') + '">' + escapeHtml(t.text) + '</span>' +
        '<span class="ar-task-date">' + dateLabel + '</span>' +
        '<button class="ar-task-del" onclick="deleteTask(\'' + t.id + '\')">&#10005;</button>' +
      '</div>';
    }).join('');
  }

  function formatDateShort(iso) {
    var parts = iso.split('-');
    return parts[2] + '/' + parts[1];
  }

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var DOW = ['lun','mar','mie','jue','vie','sab','dom'];

  function renderCalendar() {
    var year = viewDate.getFullYear();
    var month = viewDate.getMonth();
    document.getElementById('cal-month-label').textContent = MESES[month] + ' ' + year;

    var firstDay = new Date(year, month, 1);
    var startOffset = (firstDay.getDay() + 6) % 7;
    var daysInMonth = new Date(year, month + 1, 0).getDate();

    var grid = document.getElementById('cal-grid');
    var html = DOW.map(function(d) { return '<div class="ar-cal-dow">' + d + '</div>'; }).join('');

    for (var i = 0; i < startOffset; i++) {
      html += '<div class="ar-cal-cell empty"></div>';
    }

    for (var day = 1; day <= daysInMonth; day++) {
      var iso = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      var dayTasks = state.calTasks.filter(function(t) { return t.dia === iso; });
      var chips = dayTasks.map(function(t) {
        return '<span class="ar-chip ar-chip-' + t.canal + '" onclick="deleteCalTask(\'' + t.id + '\')" title="' + escapeHtml(t.tarea) + ' (click para eliminar)">' + escapeHtml(t.tarea) + '</span>';
      }).join('');
      html += '<div class="ar-cal-cell"><div class="ar-cal-daynum">' + day + '</div>' + chips + '</div>';
    }

    grid.innerHTML = html;
  }

  function render() {
    renderTasks();
    renderCalendar();
  }

  loadState();
  window.__sharedLive(loadState);
})();
</script>
