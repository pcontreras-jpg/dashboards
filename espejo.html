<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@400;500;600&family=Allura&display=swap');
  * { box-sizing: border-box; }
  .ee-root { font-family: 'Poppins', sans-serif; color: #1A1A1A; background: #FAF5F4; padding: 32px 24px 48px; border-radius: 16px; }
  .ee-logo-img { display: block; margin: 0 auto 28px; max-width: 320px; width: 100%; height: auto; }
  .ee-section-title { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 600; margin: 36px 0 14px; }
  .ee-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .ee-kpi-card { background: #FFFFFF; border: 0.5px solid #E9DEE2; border-radius: 12px; padding: 18px 20px; }
  .ee-kpi-label { font-size: 13px; color: #8A6B74; margin: 0 0 8px; }
  .ee-kpi-row { display: flex; align-items: center; justify-content: space-between; }
  .ee-kpi-value { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 600; }
  .ee-kpi-btns button { width: 28px; height: 28px; border-radius: 50%; border: 0.5px solid #D9C3CA; background: #FAF5F4; font-size: 15px; cursor: pointer; color: #1A1A1A; }
  .ee-kpi-btns button:hover { background: #F1E2E6; }
  .ee-kpi-btns { display: flex; gap: 6px; }
  .ee-card { background: #FFFFFF; border: 0.5px solid #E9DEE2; border-radius: 12px; padding: 18px 20px; }
  .ee-form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .ee-form-row input, .ee-form-row select { font-family: 'Poppins', sans-serif; font-size: 14px; padding: 8px 10px; border: 0.5px solid #D9C3CA; border-radius: 8px; background: #FAF5F4; color: #1A1A1A; }
  .ee-form-row input[type="text"] { flex: 1; min-width: 140px; }
  .ee-form-row input[type="date"] { min-width: 140px; }
  .ee-add-btn { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; padding: 8px 16px; border-radius: 8px; border: none; background: #9D637E; color: #FFFFFF; cursor: pointer; }
  .ee-add-btn:hover { background: #82506A; }
  .ee-task-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid #F0E4E8; }
  .ee-task-item:last-child { border-bottom: none; }
  .ee-task-check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #9D637E; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; }
  .ee-task-check.done { background: #9D637E; border-color: #9D637E; color: #fff; font-size: 12px; }
  .ee-task-text { flex: 1; font-size: 14px; }
  .ee-task-text.done { text-decoration: line-through; color: #B4A2A9; }
  .ee-task-date { font-size: 12px; color: #8A6B74; white-space: nowrap; }
  .ee-task-del { border: none; background: none; color: #B4A2A9; cursor: pointer; font-size: 15px; padding: 2px 4px; }
  .ee-task-del:hover { color: #9D637E; }
  .ee-empty { color: #B4A2A9; font-size: 13px; padding: 6px 0; }
  .ee-cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .ee-cal-nav { display: flex; gap: 6px; }
  .ee-cal-nav button { width: 30px; height: 30px; border-radius: 8px; border: 0.5px solid #D9C3CA; background: #FAF5F4; cursor: pointer; font-size: 14px; }
  .ee-cal-month { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 600; text-transform: capitalize; }
  .ee-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .ee-cal-dow { font-size: 11px; color: #8A6B74; text-align: center; padding-bottom: 6px; text-transform: uppercase; }
  .ee-cal-cell { min-height: 78px; border: 0.5px solid #F0E4E8; border-radius: 8px; padding: 5px; background: #FFFDFC; }
  .ee-cal-cell.empty { background: transparent; border: none; }
  .ee-cal-daynum { font-size: 12px; color: #8A6B74; margin-bottom: 3px; }
  .ee-chip { font-size: 10.5px; padding: 2px 6px; border-radius: 6px; margin-bottom: 3px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .ee-chip-rrss { background: #FBEAF0; color: #72243E; }
  .ee-chip-wsp { background: #EAF3DE; color: #27500A; }
  .ee-chip-web { background: #E6F1FB; color: #0C447C; }
  .ee-chip-otro { background: #F1EFE8; color: #444441; }
  .ee-chip-todas { background: #FBE3E1; color: #A32B24; }
  .ee-cal-cell.ee-drop { border-color: #9D637E; background: #F7EDF1; }
  .ee-chip.ee-dragging { opacity: 0.4; }
  .ee-modal-overlay { position: fixed; inset: 0; background: rgba(26,26,26,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
  .ee-modal { background: #FFFFFF; border-radius: 14px; padding: 20px; width: 100%; max-width: 320px; }
  .ee-modal h4 { font-family: 'Playfair Display', serif; margin: 0 0 14px; font-size: 17px; }
  .ee-modal label { font-size: 12px; color: #8A6B74; display: block; margin: 10px 0 4px; }
  .ee-modal input, .ee-modal select { width: 100%; font-family: 'Poppins', sans-serif; font-size: 14px; padding: 8px 10px; border: 0.5px solid #D9C3CA; border-radius: 8px; background: #FAF5F4; color: #1A1A1A; }
  .ee-modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .ee-modal-actions button { flex: 1; font-family: 'Poppins', sans-serif; font-size: 13px; padding: 9px; border-radius: 8px; border: none; cursor: pointer; }
  .ee-modal-save { background: #9D637E; color: #fff; }
  .ee-modal-delete { background: #F1EFE8; color: #72243E; }
  .ee-modal-cancel { background: #F1EFE8; color: #1A1A1A; }
  .ee-legend { display: flex; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .ee-legend span { font-size: 11px; color: #8A6B74; display: flex; align-items: center; gap: 5px; }
  .ee-legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .ee-kpi-toggle { font-size: 12px; color: #8A6B74; transition: transform 0.15s; }
  .ee-kpi-toggle.open { transform: rotate(180deg); }
  .ee-kpi-panel { margin-top: 14px; padding-top: 14px; border-top: 0.5px solid #E9DEE2; }
  .ee-client-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 0.5px solid #F0E4E8; font-size: 13px; flex-wrap: wrap; }
  .ee-client-item:last-child { border-bottom: none; }
  .ee-client-item span { flex: 1; min-width: 90px; }
  .ee-backup-bar { display: flex; gap: 8px; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 0.5px solid #E9DEE2; flex-wrap: wrap; }
  .ee-backup-btn { font-family: 'Poppins', sans-serif; font-size: 12.5px; padding: 7px 12px; border-radius: 8px; border: 0.5px solid #D9C3CA; background: #FFFFFF; color: #1A1A1A; cursor: pointer; }
  .ee-backup-btn:hover { background: #F6EEF1; }
  #save-status { display: none; font-size: 12px; color: #B23B5E; width: 100%; }
</style>

   Guardado compartido — no cambia nada del dashboard, solo dónde se guarda.
   Reemplaza el window.storage del Claude de escritorio por una tabla comun,
   asi todos los que abren el link ven y editan lo mismo, en vivo.
   =========================================================================== */
(function() {
  var SB_URL  = 'https://ljdjiyghodcfgenzjowt.supabase.co';
  var SB_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqZGppeWdob2RjZmdlbnpqb3d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NDI4NDMsImV4cCI6MjA5MDExODg0M30.TYvXvS-NXsbn56Wg4oN4g9C7Iv_KlS6nhN1f5tEnfx0';
  var TABLE   = 'shared_docs';
  var DOC_ID  = 'espejo';

  var API = SB_URL + '/rest/v1/' + TABLE;
  var HEAD = { 'apikey': SB_KEY, 'authorization': 'Bearer ' + SB_KEY, 'content-type': 'application/json' };

  var lastSeen = null;
  var writing  = false;

  window.storage = {
    get: async function() {
      var r = await fetch(API + '?id=eq.' + DOC_ID + '&select=data,updated_at', { headers: HEAD });
      if (!r.ok) throw new Error('GET ' + r.status);
      var rows = await r.json();
      if (!rows.length) return null;
      lastSeen = rows[0].updated_at;
      return { value: rows[0].data };
    },
    set: async function(key, value) {
      writing = true;
      try {
        var body = [{ id: DOC_ID, data: value, updated_at: new Date().toISOString() }];
        var r = await fetch(API, {
          method: 'POST',
          headers: Object.assign({}, HEAD, { 'Prefer': 'resolution=merge-duplicates,return=representation' }),
          body: JSON.stringify(body)
        });
        if (!r.ok) throw new Error('POST ' + r.status);
        var rows = await r.json();
        if (rows && rows[0]) lastSeen = rows[0].updated_at;
      } finally { writing = false; }
    }
  };

  window.__sharedLive = function(reload) {
    setInterval(async function() {
      if (writing || document.hidden) return;
      try {
        var r = await fetch(API + '?id=eq.' + DOC_ID + '&select=updated_at', { headers: HEAD });
        if (!r.ok) return;
        var rows = await r.json();
        if (rows.length && rows[0].updated_at !== lastSeen) reload();
      } catch (e) {}
    }, 4000);
  };
})();
</script>
<script>
(function() {
  var STORAGE_KEY = 'ee-dashboard-data';
  var state = { citasList: [], contactarList: [], tasks: [], calTasks: [] };
  var viewDate = new Date();

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  async function loadState() {
    try {
      var res = await window.storage.get(STORAGE_KEY, true);
      if (res && res.value) {
        var parsed = JSON.parse(res.value);
        state = Object.assign(state, parsed);
      }
    } catch (e) { /* no data yet */ }
    render();
  }

  async function saveState() {
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
        return;
      } catch (e) {
        if (attempt === 2) {
          console.error('storage error tras 3 intentos', e);
          var badge = document.getElementById('save-status');
          if (badge) { badge.textContent = 'No se pudo guardar en la nube — usa "Descargar respaldo"'; badge.style.display = 'block'; }
        } else {
          await new Promise(function(r) { setTimeout(r, 500 * (attempt + 1)); });
        }
      }
    }
  }

  window.exportData = function() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'efecto-espejo-datos.json';
    a.click();
    URL.revokeObjectURL(url);
  };

  window.importData = function(evt) {
    var file = evt.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var parsed = JSON.parse(e.target.result);
        state = Object.assign({ citasList: [], contactarList: [], tasks: [], calTasks: [] }, parsed);
        render();
        saveState();
      } catch (err) { alert('Archivo invalido'); }
    };
    reader.readAsText(file);
    evt.target.value = '';
  };

  window.togglePanel = function(key) {
    var panel = document.getElementById('panel-' + key);
    var toggle = document.getElementById('toggle-' + key);
    var open = panel.style.display !== 'none';
    panel.style.display = open ? 'none' : 'block';
    toggle.classList.toggle('open', !open);
  };

  window.addCita = function() {
    var nombre = document.getElementById('citas-nombre');
    var fecha = document.getElementById('citas-fecha');
    var telefono = document.getElementById('citas-telefono');
    if (!nombre.value.trim()) return;
    state.citasList.push({ id: uid(), nombre: nombre.value.trim(), fecha: fecha.value, telefono: telefono.value.trim() });
    nombre.value = ''; fecha.value = ''; telefono.value = '';
    render();
    saveState();
  };

  window.deleteCita = function(id) {
    state.citasList = state.citasList.filter(function(x) { return x.id !== id; });
    render();
    saveState();
  };

  window.addContactar = function() {
    var nombre = document.getElementById('contactar-nombre');
    var telefono = document.getElementById('contactar-telefono');
    var mail = document.getElementById('contactar-mail');
    if (!nombre.value.trim()) return;
    state.contactarList.push({ id: uid(), nombre: nombre.value.trim(), telefono: telefono.value.trim(), mail: mail.value.trim() });
    nombre.value = ''; telefono.value = ''; mail.value = '';
    render();
    saveState();
  };

  window.deleteContactar = function(id) {
    state.contactarList = state.contactarList.filter(function(x) { return x.id !== id; });
    render();
    saveState();
  };

  window.addTask = function() {
    var input = document.getElementById('task-input');
    var text = input.value.trim();
    if (!text) return;
    state.tasks.push({ id: uid(), text: text, done: false });
    input.value = '';
    render();
    saveState();
  };

  window.toggleTask = function(id) {
    var t = state.tasks.find(function(x) { return x.id === id; });
    if (t) t.done = !t.done;
    render();
    saveState();
  };

  window.deleteTask = function(id) {
    state.tasks = state.tasks.filter(function(x) { return x.id !== id; });
    render();
    saveState();
  };

  window.addCalTask = function() {
    var tareaInput = document.getElementById('cal-tarea');
    var diaInput = document.getElementById('cal-dia');
    var canalInput = document.getElementById('cal-canal');
    var tarea = tareaInput.value.trim();
    var dia = diaInput.value;
    if (!tarea || !dia) return;
    state.calTasks.push({ id: uid(), tarea: tarea, dia: dia, canal: canalInput.value });
    tareaInput.value = '';
    diaInput.value = '';
    viewDate = new Date(dia + 'T00:00:00');
    render();
    saveState();
  };

  window.deleteCalTask = function(id) {
    state.calTasks = state.calTasks.filter(function(x) { return x.id !== id; });
    render();
    saveState();
  };

  var modalEditingId = null;

  window.openCalModal = function(id) {
    var t = state.calTasks.find(function(x) { return x.id === id; });
    if (!t) return;
    modalEditingId = id;
    document.getElementById('modal-tarea').value = t.tarea;
    document.getElementById('modal-dia').value = t.dia;
    document.getElementById('modal-canal').value = t.canal;
    document.getElementById('cal-modal').style.display = 'flex';
  };

  window.closeCalModal = function() {
    modalEditingId = null;
    document.getElementById('cal-modal').style.display = 'none';
  };

  window.saveCalModal = function() {
    var t = state.calTasks.find(function(x) { return x.id === modalEditingId; });
    if (!t) return;
    var tarea = document.getElementById('modal-tarea').value.trim();
    var dia = document.getElementById('modal-dia').value;
    if (!tarea || !dia) return;
    t.tarea = tarea;
    t.dia = dia;
    t.canal = document.getElementById('modal-canal').value;
    closeCalModal();
    render();
    saveState();
  };

  window.deleteFromModal = function() {
    state.calTasks = state.calTasks.filter(function(x) { return x.id !== modalEditingId; });
    closeCalModal();
    render();
    saveState();
  };

  // Arrastrar una tarea a otro dia
  window.__dragStart = function(ev, id) {
    ev.dataTransfer.setData('text/plain', id);
    ev.dataTransfer.effectAllowed = 'move';
    ev.target.classList.add('ee-dragging');
  };

  window.__dragEnd = function(ev) {
    ev.target.classList.remove('ee-dragging');
  };

  window.__dragOver = function(ev) {
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
    ev.currentTarget.classList.add('ee-drop');
  };

  window.__dragLeave = function(ev) {
    ev.currentTarget.classList.remove('ee-drop');
  };

  window.__drop = function(ev, iso) {
    ev.preventDefault();
    ev.currentTarget.classList.remove('ee-drop');
    var id = ev.dataTransfer.getData('text/plain');
    var t = state.calTasks.find(function(x) { return x.id === id; });
    if (!t || t.dia === iso) return;
    t.dia = iso;
    render();
    saveState();
  };

  window.shiftMonth = function(delta) {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + delta, 1);
    render();
  };

  function renderTasks() {
    var list = document.getElementById('task-list');
    if (state.tasks.length === 0) {
      list.innerHTML = '<p class="ee-empty">Sin ideas todavia.</p>';
      return;
    }
    list.innerHTML = state.tasks.map(function(t) {
      return '<div class="ee-task-item">' +
        '<button class="ee-task-check' + (t.done ? ' done' : '') + '" onclick="toggleTask(\'' + t.id + '\')">' + (t.done ? '&#10003;' : '') + '</button>' +
        '<span class="ee-task-text' + (t.done ? ' done' : '') + '">' + escapeHtml(t.text) + '</span>' +
        '<button class="ee-task-del" onclick="deleteTask(\'' + t.id + '\')">&#10005;</button>' +
      '</div>';
    }).join('');
  }

  function formatDateShort(iso) {
    var parts = iso.split('-');
    return parts[2] + '/' + parts[1];
  }

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var DOW = ['lun','mar','mie','jue','vie','sab','dom'];

  function renderCalendar() {
    var year = viewDate.getFullYear();
    var month = viewDate.getMonth();
    document.getElementById('cal-month-label').textContent = MESES[month] + ' ' + year;

    var firstDay = new Date(year, month, 1);
    var startOffset = (firstDay.getDay() + 6) % 7;
    var daysInMonth = new Date(year, month + 1, 0).getDate();

    var grid = document.getElementById('cal-grid');
    var html = DOW.map(function(d) { return '<div class="ee-cal-dow">' + d + '</div>'; }).join('');

    for (var i = 0; i < startOffset; i++) {
      html += '<div class="ee-cal-cell empty"></div>';
    }

    for (var day = 1; day <= daysInMonth; day++) {
      var iso = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      var dayTasks = state.calTasks.filter(function(t) { return t.dia === iso; });
      var chips = dayTasks.map(function(t) {
        return '<span class="ee-chip ee-chip-' + t.canal + '" draggable="true" ondragstart="__dragStart(event, \'' + t.id + '\')" ondragend="__dragEnd(event)" onclick="openCalModal(\'' + t.id + '\')" title="' + escapeHtml(t.tarea) + ' (click para editar, arrastra para mover)">' + escapeHtml(t.tarea) + '</span>';
      }).join('');
      html += '<div class="ee-cal-cell" ondragover="__dragOver(event)" ondragleave="__dragLeave(event)" ondrop="__drop(event, \'' + iso + '\')"><div class="ee-cal-daynum">' + day + '</div>' + chips + '</div>';
    }

    grid.innerHTML = html;
  }

  function renderCitas() {
    document.getElementById('kpi-citas').textContent = state.citasList.length;
    var list = document.getElementById('citas-list');
    if (state.citasList.length === 0) {
      list.innerHTML = '<p class="ee-empty">Sin citas todavia.</p>';
      return;
    }
    list.innerHTML = state.citasList.map(function(c) {
      return '<div class="ee-client-item">' +
        '<span>' + escapeHtml(c.nombre) + '</span>' +
        '<span>' + (c.fecha ? formatDateShort(c.fecha) : '') + '</span>' +
        '<span>' + escapeHtml(c.telefono) + '</span>' +
        '<button class="ee-task-del" onclick="deleteCita(\'' + c.id + '\')">&#10005;</button>' +
      '</div>';
    }).join('');
  }

  function renderContactar() {
    document.getElementById('kpi-clientes').textContent = state.contactarList.length;
    var list = document.getElementById('contactar-list');
    if (state.contactarList.length === 0) {
      list.innerHTML = '<p class="ee-empty">Sin clientes todavia.</p>';
      return;
    }
    list.innerHTML = state.contactarList.map(function(c) {
      return '<div class="ee-client-item">' +
        '<span>' + escapeHtml(c.nombre) + '</span>' +
        '<span>' + escapeHtml(c.telefono) + '</span>' +
        '<span>' + escapeHtml(c.mail) + '</span>' +
        '<button class="ee-task-del" onclick="deleteContactar(\'' + c.id + '\')">&#10005;</button>' +
      '</div>';
    }).join('');
  }

  function render() {
    renderCitas();
    renderContactar();
    renderTasks();
    renderCalendar();
  }

  loadState();
  window.__sharedLive(loadState);
})();
</script>

<script>
/* Favicon: usa el mismo logo que ya esta en la pagina, sin modificarlo. */
(function() {
  var img = document.querySelector('.ee-logo-img');
  if (!img || !img.src) return;
  var link = document.createElement('link');
  link.rel = 'icon';
  link.href = img.src;
  document.head.appendChild(link);
})();
</script>
